name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: '6.0'

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app
    
    - name: Swift version
      run: swift --version
    
    - name: Build
      run: swift build -v
    
    - name: Run tests
      run: swift test -v --parallel
    
    - name: Build release
      run: swift build -c release -v

  build-examples:
    name: Build Examples
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app
    
    - name: Build Examples
      run: |
        if [ -f Examples/Package.swift ]; then
          swift build --package-path Examples -v
        else
          echo "No active Examples/Package.swift; skipping examples build."
        fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: swiftlint --strict --config .swiftlint.yml
