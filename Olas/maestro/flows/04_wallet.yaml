# Wallet Flow Test
# Verifies wallet tab and setup flows work correctly

appId: com.olas.app
name: Wallet Flow

---

# Launch the app (assumes logged in state)
- launchApp

# Wait for main view
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 5000
    optional: true

# Navigate to Wallet tab
- tapOn:
    text: "Wallet"

# Wait for wallet view to load
- extendedWaitUntil:
    visible:
      text: "Wallet"
    timeout: 5000
    optional: true

- takeScreenshot: "wallet_initial"

# Check for wallet setup view or balance view
# If not set up, should see setup options
- assertVisible:
    text: "Spark"
    optional: true

- assertVisible:
    text: "Cashu"
    optional: true

# If already set up, should see balance
- assertVisible:
    text: "sats"
    optional: true

- assertVisible:
    text: "Balance"
    optional: true

# Look for deposit/send buttons if wallet is set up
- assertVisible:
    text: "Deposit"
    optional: true

- assertVisible:
    text: "Send"
    optional: true

- takeScreenshot: "wallet_state"

# If there's a settings button, tap it
- tapOn:
    id: "gearshape"
    optional: true

- tapOn:
    text: "Settings"
    optional: true

# Dismiss any sheet that may have opened
- swipe:
    direction: DOWN
    duration: 500
    optional: true

# Navigate back to Home
- tapOn:
    text: "Home"

- takeScreenshot: "wallet_flow_complete"
