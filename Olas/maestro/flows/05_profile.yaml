# Profile Flow Test
# Verifies profile tab and navigation to settings

appId: com.olas.app
name: Profile Flow

---

# Launch the app (assumes logged in state)
- launchApp

# Wait for main view
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 5000
    optional: true

# Navigate to Profile tab
- tapOn:
    text: "Profile"

# Wait for profile view to load
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 5000
    optional: true

- takeScreenshot: "profile_initial"

# Profile should show user info
# Look for common profile elements
- assertVisible:
    text: "Following"
    optional: true

- assertVisible:
    text: "Followers"
    optional: true

# Look for settings/gear icon in navigation
- tapOn:
    id: "gearshape"
    optional: true

# Fallback to tapping settings icon
- tapOn:
    text: "Settings"
    optional: true

# Wait for settings view
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 3000
    optional: true

- takeScreenshot: "settings_opened"

# Verify key settings sections exist
- assertVisible:
    text: "Account"
    optional: true

- assertVisible:
    text: "Wallet"
    optional: true

- assertVisible:
    text: "Appearance"
    optional: true

- assertVisible:
    text: "Relays"
    optional: true

# Verify logout button exists
- assertVisible:
    text: "Logout"
    optional: true

- takeScreenshot: "settings_view"

# Navigate back to profile
- tapOn:
    id: "backButton"
    optional: true

# Or use back navigation
- back
    optional: true

# Navigate back to Home
- tapOn:
    text: "Home"

- takeScreenshot: "profile_flow_complete"
