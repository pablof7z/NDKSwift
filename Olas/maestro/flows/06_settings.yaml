# Settings Flow Test
# Verifies settings navigation and key sections

appId: com.olas.app
name: Settings Flow

---

# Launch the app (assumes logged in state)
- launchApp

# Wait for main view
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 5000
    optional: true

# Navigate to Profile tab first
- tapOn:
    text: "Profile"

# Wait for profile
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 3000
    optional: true

# Open settings
- tapOn:
    id: "gearshape"
    optional: true

- tapOn:
    text: "Settings"
    optional: true

# Wait for settings view
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 3000
    optional: true

- takeScreenshot: "settings_main"

# Test Account settings navigation
- tapOn:
    text: "Account"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 2000
    optional: true

- takeScreenshot: "settings_account"

# Go back
- back

# Test Appearance settings
- tapOn:
    text: "Appearance"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 2000
    optional: true

- takeScreenshot: "settings_appearance"

# Go back
- back

# Test Video settings
- tapOn:
    text: "Video"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 2000
    optional: true

- takeScreenshot: "settings_video"

# Go back
- back

# Test Relays settings
- tapOn:
    text: "Relays"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 2000
    optional: true

- takeScreenshot: "settings_relays"

# Go back
- back

# Test Media Servers (Blossom) settings
- tapOn:
    text: "Media Servers"

- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 2000
    optional: true

- takeScreenshot: "settings_blossom"

# Go back
- back

# Verify logout button is visible
- assertVisible:
    text: "Logout"

# DO NOT actually logout - just verify it's there
- takeScreenshot: "settings_complete"

# Navigate back to home
- back
- tapOn:
    text: "Home"

- takeScreenshot: "settings_flow_complete"
