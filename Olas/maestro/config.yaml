# Maestro Configuration for Olas
# Run with: maestro test maestro/

appId: com.olas.app
name: Olas E2E Tests

# Default flow settings
flows:
  - "flows/*.yaml"

# Environment variables for test data
env:
  # Test account details (for login flow)
  # In CI, these should be injected as secrets
  TEST_NSEC: "${TEST_NSEC:-}"
  TEST_NPUB: "${TEST_NPUB:-}"

# Retry settings
retryOnFailure: 2

# Screenshot settings
screenshotOnFailure: true
