name: Chirp
options:
  bundleIdPrefix: com.ndkswift
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

packages:
  ChirpFeature:
    path: ChirpPackage

targets:
  Chirp:
    type: application
    platform: iOS
    sources:
      - Chirp
    dependencies:
      - package: ChirpFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ndkswift.Chirp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleURLTypes: "<array><dict><key>CFBundleURLSchemes</key><array><string>chirp</string></array></dict></array>"
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "<array><string>nostrconnect</string><string>primal</string></array>"

schemes:
  Chirp:
    build:
      targets:
        Chirp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
