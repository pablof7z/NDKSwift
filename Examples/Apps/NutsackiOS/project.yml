name: NutsackiOS
options:
  bundleIdPrefix: com.nutsack
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.nutsack.wallet
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  NDKSwift:
    path: ../../..
targets:
  NutsackiOS:
    type: application
    platform: iOS
    sources: 
      - Sources/NutsackiOS
    dependencies:
      - package: NDKSwift
        product: NDKSwift
    info:
      path: Sources/NutsackiOS/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        INFOPLIST_FILE: Sources/NutsackiOS/Info.plist
        PRODUCT_NAME: Nutsack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    preBuildScripts:
      - script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            echo "Debug build"
          fi
        name: "Debug Check"

